upstream gateway_app {
    server gateway:8080;
    keepalive 64;
}

upstream django_app {
    server web:8000;
    keepalive 32;
}

upstream minio_api {
    server minio:9000;
    keepalive 16;
}

server {
    listen 80;
    server_name audoack.in www.audoack.in localhost;

    client_max_body_size 100M;

    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|phpmyadmin|\.env|\.git|\.aws|terraform\.tfstate) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(php|php[0-9]?|asp|aspx|jsp)$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /autoace-media/ {
        proxy_pass http://minio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /healthz {
        proxy_pass http://gateway_app/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 10s;
    }

    location /api/v1/sessions/ {
        proxy_pass http://gateway_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/v1/latest-analysis/ {
        proxy_pass http://gateway_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /favicon.ico {
        alias /app/staticfiles/audio_analytics/favicon.ico;
        access_log off;
        log_not_found off;
    }
}
