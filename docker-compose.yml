services:
  db:
    image: postgres:15-alpine
    container_name: audoack_db
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: audoack_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: audoack_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: [.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio_init:
    image: minio/mc:latest
    container_name: audoack_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file: [.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-autoace-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_NAME"

  web:
    image: ghcr.io/gourav-tailor/audoack_ai:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audoack_django
    restart: unless-stopped
    command: >
      sh -c 'python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             exec gunicorn audoack_ai.wsgi:application --bind 0.0.0.0:8000 --workers ${DJANGO_WORKERS:-3} --timeout 300 --access-logfile -'
    volumes:
      - static_data:/app/staticfiles
      - upload_tmp:/tmp
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    image: ghcr.io/gourav-tailor/audoack_ai:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audoack_celery
    restart: unless-stopped
    command: celery -A audoack_ai worker --loglevel=info --concurrency=$${CELERY_CONCURRENCY:-1}
    volumes:
      - hf_cache:/root/.cache/huggingface
      - numba_cache:/app/numba_cache
      - upload_tmp:/tmp
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A audoack_ai inspect ping --timeout=3 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  gateway:
    image: ghcr.io/gourav-tailor/audoack_ai-gateway:latest
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: audoack_gateway
    restart: unless-stopped
    env_file: [.env]
    environment:
      LISTEN_ADDR: :8080
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      DJANGO_INTERNAL_URL: http://web:8000
      CELERY_QUEUE: ${CELERY_QUEUE:-celery}
      DB_MAX_CONNS: ${GATEWAY_DB_MAX_CONNS:-20}
      DB_MIN_CONNS: ${GATEWAY_DB_MIN_CONNS:-2}
    volumes:
      - upload_tmp:/tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: audoack_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
      gateway:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  redis_data:
  static_data:
  hf_cache:
  numba_cache:
  upload_tmp:
